name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by the publish workflow

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        # CPU build of torch: much smaller than the default CUDA build
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Cache models and test media
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            .pytest_cache
          key: models-${{ hashFiles('src/inavamos/models.py') }}

      - name: Run tests
        run: pytest -v
